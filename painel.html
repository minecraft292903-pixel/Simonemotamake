<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — Simone Mota</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.1.9/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: { name: "git-gateway", branch: "main" },
        media_folder: "",
        public_folder: "",
        collections: [
          {
            name: "conteudo",
            label: "Conteúdo do Site",
            files: [
              {
                file: "content.json",
                label: "Site — Simone Mota",
                name: "site",
                fields: [
                  { label: "Número de WhatsApp (só números, com DDI 55)", name: "whatsapp", widget: "string" },
                  { label: "Link do Instagram", name: "instagram", widget: "string" },
                  { label: "Link do Linktree", name: "linktree", widget: "string" },
                  {
                    label: "Hero (topo do site)", name: "hero", widget: "object",
                    fields: [
                      { label: "Tag pequena", name: "tag", widget: "string" },
                      { label: "Título", name: "titulo", widget: "string" },
                      { label: "Subtítulo", name: "subtitulo", widget: "text" },
                      { label: "Imagem de fundo", name: "imagem", widget: "image" },
                      { label: "Vídeo de fundo (opcional)", name: "video", widget: "file", required: false }
                    ]
                  },
                  {
                    label: "Sobre Simone Mota", name: "sobre", widget: "object",
                    fields: [
                      { label: "Título", name: "titulo", widget: "string" },
                      { label: "Texto 1", name: "texto1", widget: "text" },
                      { label: "Texto 2", name: "texto2", widget: "text" },
                      { label: "Foto", name: "imagem", widget: "image" },
                      { label: "Selos/Tags", name: "tags", widget: "list" }
                    ]
                  },
                  {
                    label: "Diferenciais (4 cards)", name: "diferenciais", widget: "list",
                    fields: [
                      { label: "Título", name: "titulo", widget: "string" },
                      { label: "Texto", name: "texto", widget: "text" }
                    ]
                  },
                  {
                    label: "Serviços", name: "servicos", widget: "list",
                    fields: [
                      { label: "Nome do serviço", name: "nome", widget: "string" },
                      { label: "Descrição", name: "texto", widget: "text" },
                      { label: "Foto", name: "imagem", widget: "image" }
                    ]
                  },
                  {
                    label: "Dia da Noiva", name: "diaDaNoiva", widget: "object",
                    fields: [
                      { label: "Título", name: "titulo", widget: "string" },
                      { label: "Texto", name: "texto", widget: "text" },
                      { label: "Foto", name: "imagem", widget: "image" },
                      { label: "Vídeo (opcional)", name: "video", widget: "file", required: false }
                    ]
                  },
                  {
                    label: "Portfólio (galeria)", name: "portfolio", widget: "list",
                    fields: [
                      { label: "Categoria", name: "categoria", widget: "select", options: ["noivas", "penteados", "bastidores"] },
                      { label: "Foto", name: "imagem", widget: "image" },
                      { label: "Descrição da foto (alt)", name: "alt", widget: "string" }
                    ]
                  },
                  {
                    label: "Como funciona (linha do tempo)", name: "timeline", widget: "list",
                    fields: [
                      { label: "Título da etapa", name: "titulo", widget: "string" },
                      { label: "Texto", name: "texto", widget: "text" }
                    ]
                  },
                  {
                    label: "Perguntas Frequentes", name: "faq", widget: "list",
                    fields: [
                      { label: "Pergunta", name: "pergunta", widget: "string" },
                      { label: "Resposta", name: "resposta", widget: "text" }
                    ]
                  },
                  { label: "Fotos do Instagram (tira de 4 fotos)", name: "instagramTiras", widget: "list", field: { label: "Foto", name: "imagem", widget: "image" } }
                ]
              }
            ]
          }
        ]
      }
    });
  </script>
</body>
</html>
